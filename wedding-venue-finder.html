<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wedding Venue Finder</title>
    <link rel="stylesheet" href="css/wedding-venue-finder.css">
</head>
<body>
    <script>
        // Authentication check
        if (!sessionStorage.getItem('weddingAppLoggedIn')) {
            window.location.href = 'login.html';
        }
    </script>
    <div class="container">
        <h1>Smart Wedding Venue Finder</h1>
        <p class="subtitle">Find your perfect celebration space</p>

        <form id="venueForm">
            <div class="form-group">
                <label class="form-label">
                    <span class="icon">📅</span>
                    Wedding Date
                </label>
                <input type="date" id="weddingDate" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="icon">👥</span>
                    Number of Guests
                </label>
                <input type="number" id="guestCount" value="100" min="10" max="500">
                <div class="slider-container">
                    <input type="range" id="guestSlider" class="slider" min="10" max="500" value="100">
                    <div class="slider-labels">
                        <span>10</span>
                        <span>500</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span class="icon">💰</span>
                    Total Budget
                </label>
                <div class="budget-inputs">
                    <input type="number" id="minBudget" value="2000" min="1000" step="100">
                    <input type="number" id="maxBudget" value="10000" min="1000" step="100">
                </div>
                <div class="budget-range">
                    $<span id="budgetMin">2,000</span> - $<span id="budgetMax">10,000</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Desired Features
                </label>
                <div class="features-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="outdoor">
                        <span>Outdoor Garden</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="bar">
                        <span>Bar Service</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="indoor">
                        <span>Indoor Hall</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="parking">
                        <span>Parking</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="catering">
                        <span>Catering</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="dance">
                        <span>Dance Floor</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="waterfront">
                        <span>Waterfront View</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="ceremony">
                        <span>Outdoor Ceremony Space</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="av">
                        <span>AV Equipment</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="search-button">
                <span>🔍</span>
                Search Venues
            </button>
        </form>
    </div>

    <script src="js/wedding-venue-finder.js"></script>
</body>
</html>
