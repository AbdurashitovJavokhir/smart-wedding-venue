<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Venue - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="heart-icon">♥</div>
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Log in to manage your wedding reservations</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-header">
                        <label for="password" class="form-label">Password</label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="login-button">Login →</button>
            </form>

            <div class="signup-section">
                <p class="signup-text">Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="guest-button">Continue as guest</button>
        </div>

        <footer class="login-footer">
            SMART WEDDING VENUE RESERVATION PLATFORM
        </footer>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
